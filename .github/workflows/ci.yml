name: ANSTS v2.2 TypeScript & celld HA CI Pipeline

on:
  push:
    branches: ["main", "master", "release/**", "feat/celld-v25"]
  pull_request:
    branches: ["main", "master", "feat/celld-v25"]
  workflow_dispatch:

jobs:
  lint-build-and-test:
    name: "Verify TypeScript AST, Build & Integration Tests (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # scheduler_persistence.test.ts loads node:sqlite at import time.
        # That built-in is absent on Node 18/20 (ERR_UNKNOWN_BUILTIN_MODULE) and
        # unflagged starting with Node 22.13. Do not re-add 18.x/20.x or skip the test.
        node-version: ["22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Stage 1 — TypeScript AST, Google Style & Schema Lint
        run: npm run lint

      - name: Stage 2 — Compile TypeScript modules to CommonJS (dist/)
        run: npm run build

      - name: Stage 3 — Execute the full integration, chaos & celld suite
        run: npm test
