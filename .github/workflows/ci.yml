name: ANSTS v2.2 TypeScript & celld HA CI Pipeline

on:
  # Push and pull_request filters are taken from the workflow file in the pushed
  # commit or the PR merge commit. feat/celld-v25 must be listed or GitHub
  # creates no run (this filter was dropped when 6b40635 kept the older ci.yml).
  push:
    branches: ["main", "master", "release/**", "feat/celld-v25"]
  pull_request:
    branches: ["main", "master", "feat/celld-v25"]
  workflow_dispatch:

jobs:
  lint-build-and-test:
    name: "Verify TypeScript AST, Build & 55 Integration/Chaos Tests (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (tolerant of missing lockfile)
        run: npm install --no-audit --no-fund || true

      - name: Stage 1 — TypeScript AST, Google Style & Schema Lint
        run: npm run lint

      - name: Stage 2 — Compile 66 TypeScript Modules to CommonJS (dist/)
        run: npm run build

      - name: Stage 3 — Execute Full 55-Test Integration, Chaos & celld HA Suite
        run: npm test
