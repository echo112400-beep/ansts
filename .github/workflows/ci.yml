name: ANSTS CI

on:
  push:
    branches: ["main", "master", "release/**"]
  pull_request:
    branches: ["main", "master", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/console/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ui/console
      - name: Repository lint
        run: npm run lint
      - name: TypeScript type check
        run: npm run typecheck
      - name: Control plane verification
        run: npm run test:control
      - name: Console type check
        run: npm run typecheck --prefix ui/console
      - name: Console production build
        run: npm run build --prefix ui/console

  lint-build-and-test:
    name: Integration tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
