name: ANSTS v2.2 TypeScript & celld HA CI Pipeline

on:
  push:
    branches: ["main", "master", "release/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  lint-build-and-test:
    name: "Verify TypeScript AST, Build & 55 Integration/Chaos Tests (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (tolerant of missing lockfile)
        run: npm install --no-audit --no-fund || true

      - name: Stage 1 — TypeScript AST, Google Style & Schema Lint
        run: npm run lint

      - name: Stage 2 — Compile 66 TypeScript Modules to CommonJS (dist/)
        run: npm run build

      - name: Stage 3 — Execute Full 55-Test Integration, Chaos & celld HA Suite
        run: npm test
