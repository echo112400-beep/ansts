<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANSTS · 平台管理控制台</title>
<link rel="stylesheet" href="console-management/prototype.css">
<script src="console-management/prototype.js" defer></script>
</head>
<body>
<a class="skip" href="#content">跳至主要内容</a>
<aside class="rail">
  <div class="wordmark"><span class="brand-mark" aria-hidden="true">A</span><span>ANSTS<small>MANAGEMENT CONSOLE</small></span></div>
  <div class="workspace"><span class="health-dot"></span><span><strong>平台管理工作区</strong><small class="mono">ansts-global / v2.2</small></span><span class="workspace-tag">DEMO</span></div>
  <div class="nav-caption">平台</div><nav id="navigation" aria-label="主导航"></nav>
  <div class="rail-bottom"><div class="avatar" id="avatar">陈</div><div><strong id="principal-name">陈 · 平台管理员</strong><small id="principal-role">SRE_ADMIN</small></div><button class="icon-button" id="identity-open" aria-label="切换演示身份">···</button></div>
</aside>
<div class="shell">
<header class="context"><div class="scope-title"><span class="health-dot"></span>平台控制面</div><label>区域 <select id="region"><option value="all">所有区域</option><option value="us-west-2">US West · us-west-2</option><option value="eu-central-1">EU Central · eu-central-1</option><option value="ap-northeast-1">AP Northeast · ap-northeast-1</option></select></label><label>租户 <select id="tenant-filter"></select></label><label class="time-filter">视角 <select id="time-range"><option value="current">当前状态</option><option value="history">历史 · 09:00–09:30</option></select></label><button class="quiet" id="share-view">分享视角</button><span class="demo-label">演示数据 · 模拟操作</span></header>
<details class="demo-tools" id="demo-tools"><summary>原型演示控制 <span id="demo-summary">正常场景 · 陈 / SRE_ADMIN</span><span>展开</span></summary><div class="demo-controls"><label>场景 <select id="scenario"><option value="normal">正常管理流程</option><option value="stale">数据过期</option><option value="offline">接口不可用</option><option value="capacity">平台容量不足</option><option value="quota">租户额度耗尽</option><option value="budget">费用数据未知</option><option value="partial">批量执行部分失败</option><option value="cancel-unknown">任务停止未确认</option><option value="conflict">配置版本并发冲突</option><option value="history-missing">历史回合不可用</option><option value="verification">恢复指标再次超标</option></select></label><label>身份 <select id="identity"><option value="chen">陈 · SRE_ADMIN · 全平台</option><option value="zhou">周 · SRE_ADMIN · 全平台</option><option value="lin">林 · OPERATOR · US West / Northstar</option><option value="xu">许 · VIEWER · US West / Northstar</option></select></label><button class="small" id="reset-demo">重置演示数据</button><span class="muted">场景不会伪造生产状态；所有写操作仅在本地模拟。</span></div></details>
<main id="content" tabindex="-1"></main>
<footer class="page-footer"><span>ANSTS 管理面 / 设计原型</span><span>数据基准 2026-11-10 09:30 UTC · 本地模拟</span><a href="console-management-design.md">功能设计文档</a></footer>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><header><div><div class="eyebrow">演示数据 · 模拟操作</div><h2 id="dialog-title"></h2></div><button type="button" data-action="close-dialog" class="quiet">关闭</button></header><div class="dialog-body" id="dialog-body"></div><div id="dialog-error" role="alert"></div><footer><button type="button" data-action="close-dialog">取消</button><button type="submit" class="primary" id="dialog-submit">确认</button></footer></form></dialog>
<div class="toast" id="toast" role="status" hidden></div><div class="sr-only" id="announcer" aria-live="polite"></div>
</body></html>
