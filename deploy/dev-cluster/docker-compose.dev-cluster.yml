name: ansts-v25-dev-cluster

# Shared cluster wiring: object storage + credentials every node speaks to.
x-ansts-common-env: &ansts-common-env
  ANSTS_RUNTIME_PROFILE: "development"
  CELLD_BUCKET: "s3://ansts-fleet"
  S3_ENDPOINT: "http://rustfs:9000"
  AWS_ACCESS_KEY_ID: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
  AWS_SECRET_ACCESS_KEY: "${RUSTFS_SECRET_KEY:-rustfs_prod_secret_key_2026}"
  AWS_REGION: "us-east-1"
  CELLD_DURABILITY: "fleet"

# celld node identity: public Worker listener 8081, peer/operator listener 8082, peers dial `addr`.
x-ansts-celld-env: &ansts-celld-env
  CELLD_ESBUILD: "/app/node_modules/@esbuild/linux-x64/bin/esbuild"
  CELLD_TTL_MS: "10000"
  CELLD_REBALANCE_INTERVAL_MS: "5000"
  CELLD_READY_FLEET_GATE_MS: "15000"
  RUST_LOG: "info"

# Gateway view of the fleet: dispatch goes through the celld HTTP client, reads fan out to the same listeners.
x-ansts-gateway-routing-env: &ansts-gateway-routing-env
  ANSTS_CELLD_FLEET_URLS: '{"celld-node-01":"http://celld-brain-01:8081","celld-node-02":"http://celld-brain-02:8081","celld-node-03":"http://celld-brain-03:8081"}'
  ANSTS_CELLD_INTERNAL_URLS: '{"celld-node-01":"http://celld-brain-01:8082","celld-node-02":"http://celld-brain-02:8082","celld-node-03":"http://celld-brain-03:8082"}'
  ANSTS_PEER_BRAIN_URLS: '{"celld-node-01":"http://celld-brain-01:8081","celld-node-02":"http://celld-brain-02:8081","celld-node-03":"http://celld-brain-03:8081"}'
  ANSTS_PEER_BODY_URLS: '{"body-host-01":"http://body-daemon-01:9501","body-host-02":"http://body-daemon-02:9502"}'

services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ansts-dev-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_dev_data:/data
    environment:
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-rustfs_prod_secret_key_2026}"
    command: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/live 2>/dev/null || curl -fsS http://127.0.0.1:9000/ 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - ansts_mesh_net

  # Real denoland/celld fleet: each node runs the ANSTS brain Worker as its own Durable Object host.
  celld-brain-01:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-brain-01
    command:
      - "--bucket"
      - "s3://ansts-fleet"
      - "--endpoint"
      - "http://rustfs:9000"
      - "--region"
      - "us-east-1"
      - "--listen"
      - "0.0.0.0:8081"
      - "--internal-listen"
      - "0.0.0.0:8082"
      - "--advertise"
      - "celld-brain-01:8082"
    depends_on:
      rustfs:
        condition: service_healthy
    ports:
      - "18082:8081"
    volumes:
      - celld_01_data:/var/lib/celld
    environment:
      <<: [*ansts-common-env, *ansts-celld-env]
      CELLD_NODE: "celld-node-01"
      CELLD_WATCH: "/var/lib/celld"
    healthcheck:
      test:
        - "CMD"
        - "/usr/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /.well-known/celld/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 45s
    networks:
      - ansts_mesh_net

  celld-brain-02:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-brain-02
    command:
      - "--bucket"
      - "s3://ansts-fleet"
      - "--endpoint"
      - "http://rustfs:9000"
      - "--region"
      - "us-east-1"
      - "--listen"
      - "0.0.0.0:8081"
      - "--internal-listen"
      - "0.0.0.0:8082"
      - "--advertise"
      - "celld-brain-02:8082"
    depends_on:
      rustfs:
        condition: service_healthy
    ports:
      - "18083:8081"
    volumes:
      - celld_02_data:/var/lib/celld
    environment:
      <<: [*ansts-common-env, *ansts-celld-env]
      CELLD_NODE: "celld-node-02"
      CELLD_WATCH: "/var/lib/celld"
    healthcheck:
      test:
        - "CMD"
        - "/usr/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /.well-known/celld/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 45s
    networks:
      - ansts_mesh_net

  celld-brain-03:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-brain-03
    command:
      - "--bucket"
      - "s3://ansts-fleet"
      - "--endpoint"
      - "http://rustfs:9000"
      - "--region"
      - "us-east-1"
      - "--listen"
      - "0.0.0.0:8081"
      - "--internal-listen"
      - "0.0.0.0:8082"
      - "--advertise"
      - "celld-brain-03:8082"
    depends_on:
      rustfs:
        condition: service_healthy
    ports:
      - "18084:8081"
    volumes:
      - celld_03_data:/var/lib/celld
    environment:
      <<: [*ansts-common-env, *ansts-celld-env]
      CELLD_NODE: "celld-node-03"
      CELLD_WATCH: "/var/lib/celld"
    healthcheck:
      test:
        - "CMD"
        - "/usr/bin/bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /.well-known/celld/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 45s
    networks:
      - ansts_mesh_net

  # Publishes dist/cloudflare/worker.js into the fleet bucket; every celld node adopts it in place.
  celld-deploy:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-deploy
    entrypoint: ["/usr/bin/bash", "/app/scripts/celld_deploy.sh"]
    working_dir: /app
    depends_on:
      rustfs:
        condition: service_healthy
      celld-brain-01:
        condition: service_started
      celld-brain-02:
        condition: service_started
      celld-brain-03:
        condition: service_started
    volumes:
      - ../..:/app:ro
      - ../../.dev-secrets/body-signing.key:/run/secrets/body-signing.key:ro
    environment:
      <<: *ansts-common-env
      CELLD_CONFIG: "/app/deploy/celld/wrangler.celld.json"
      ANSTS_BODY_AUTH_SECRET_FILE: "/run/secrets/body-signing.key"
      CELLD_ESBUILD: "/app/node_modules/@esbuild/linux-x64/bin/esbuild"
    restart: "no"
    networks:
      - ansts_mesh_net

  body-daemon-01:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    container_name: ansts-body-daemon-01
    privileged: true
    ports:
      - "19501:9501"
    volumes:
      - body_01_data:/var/lib/ansts/body-host-01
      - ../../.dev-secrets/body-host-01.token:/run/secrets/body.token:ro
      - ../../scripts/body_cell_agent.mjs:/app/scripts/body_cell_agent.mjs:ro
    environment:
      <<: *ansts-common-env
      ANSTS_NODE_ID: "body-host-01"
      ANSTS_BODY_TOKEN_FILE: "/run/secrets/body.token"
      ANSTS_NODE_ROLE: "body"
      ANSTS_BODY_CELL_URL: "http://celld-brain-01:8081"
      ANSTS_LISTEN_PORT: "9501"
      ANSTS_STORAGE_DIR: "/var/lib/ansts/body-host-01"
      ANSTS_PRIMARY_GATEWAY_URL: "http://ansts-gateway-01:8080"
      ANSTS_SECONDARY_GATEWAY_URL: "http://ansts-gateway-02:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9501/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net

  body-daemon-02:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    container_name: ansts-body-daemon-02
    privileged: true
    ports:
      - "19502:9502"
    volumes:
      - body_02_data:/var/lib/ansts/body-host-02
      - ../../.dev-secrets/body-host-02.token:/run/secrets/body.token:ro
      - ../../scripts/body_cell_agent.mjs:/app/scripts/body_cell_agent.mjs:ro
    environment:
      <<: *ansts-common-env
      ANSTS_NODE_ID: "body-host-02"
      ANSTS_BODY_TOKEN_FILE: "/run/secrets/body.token"
      ANSTS_NODE_ROLE: "body"
      ANSTS_BODY_CELL_URL: "http://celld-brain-01:8081"
      ANSTS_LISTEN_PORT: "9502"
      ANSTS_STORAGE_DIR: "/var/lib/ansts/body-host-02"
      ANSTS_PRIMARY_GATEWAY_URL: "http://ansts-gateway-02:8080"
      ANSTS_SECONDARY_GATEWAY_URL: "http://ansts-gateway-01:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9502/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net

  ansts-gateway-01:
    image: ghcr.io/denoland/celld:0.6.3
    entrypoint: ["/usr/bin/bash", "/app/deploy/dev-cluster/start-celld-gateway.sh"]
    volumes:
      - ../..:/app:ro
    container_name: ansts-gateway-01
    depends_on:
      celld-deploy:
        condition: service_completed_successfully
      body-daemon-01:
        condition: service_healthy
      body-daemon-02:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      <<: [*ansts-common-env, *ansts-gateway-routing-env]
      ANSTS_NODE_ID: "celld-gw-01"
      ANSTS_USER_AUTH_SECRET_FILE: "/app/.dev-secrets/user-signing.key"
      ANSTS_GATEWAY_TOKEN_FILE: "/app/.dev-secrets/gateway-control.token"
      ANSTS_NODE_ROLE: "gateway"
      ANSTS_SCHEDULER_URL: "http://celld-brain-01:8081"
      CELLD_ESBUILD: "/app/node_modules/@esbuild/linux-x64/bin/esbuild"
      ANSTS_LISTEN_PORT: "8080"
      ANSTS_STORAGE_DIR: "/tmp/ansts/celld-gw-01"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net

  ansts-gateway-02:
    image: ghcr.io/denoland/celld:0.6.3
    entrypoint: ["/usr/bin/bash", "/app/deploy/dev-cluster/start-celld-gateway.sh"]
    volumes:
      - ../..:/app:ro
    container_name: ansts-gateway-02
    depends_on:
      celld-deploy:
        condition: service_completed_successfully
      body-daemon-01:
        condition: service_healthy
      body-daemon-02:
        condition: service_healthy
    ports:
      - "18081:8080"
    environment:
      <<: [*ansts-common-env, *ansts-gateway-routing-env]
      ANSTS_NODE_ID: "celld-gw-02"
      ANSTS_USER_AUTH_SECRET_FILE: "/app/.dev-secrets/user-signing.key"
      ANSTS_GATEWAY_TOKEN_FILE: "/app/.dev-secrets/gateway-control.token"
      ANSTS_NODE_ROLE: "gateway"
      ANSTS_SCHEDULER_URL: "http://celld-brain-01:8081"
      CELLD_ESBUILD: "/app/node_modules/@esbuild/linux-x64/bin/esbuild"
      ANSTS_LISTEN_PORT: "8080"
      ANSTS_STORAGE_DIR: "/tmp/ansts/celld-gw-02"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net

  tanstack-console:
    image: nginx:1.27-alpine
    container_name: ansts-tanstack-console
    depends_on:
      ansts-gateway-01:
        condition: service_healthy
      ansts-gateway-02:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ../../docs:/usr/share/nginx/html:ro
      - ./nginx-tanstack-console.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ansts-dev-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ansts_mesh_net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: ansts-dev-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana-dashboard.json:/var/lib/grafana/dashboards/ansts.json:ro
    networks:
      - ansts_mesh_net

networks:
  ansts_mesh_net:
    driver: bridge

volumes:
  rustfs_dev_data:
  celld_01_data:
  celld_02_data:
  celld_03_data:
  body_01_data:
  body_02_data:
  prometheus_data:
  grafana_data:
