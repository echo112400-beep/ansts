# Runtime-aligned development cluster. Keep provider/sandbox/control-ha overlays.
name: ansts-v25-dev-cluster
services:
  dev-server:
    image: ansts-v25-dev-cluster-dev-server
    container_name: ansts-console-dev-server
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ../../ui/console/app:/app/app:ro
      - ../../ui/console/components:/app/components:ro
      - ../../ui/console/lib:/app/lib:ro
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 10s
      start_period: 45s
      retries: 12
    networks:
      - ansts_mesh_net
    build:
      context: ../../ui/console
      dockerfile: Dockerfile.dev
  ansts-gateway-02:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-gateway-02
    env_file:
      - ../../.dev-secrets/ansts-gateway-02-runtime.env
    environment:
      ANSTS_MONITORING_TOKEN_FILE: /app/.dev-secrets/monitoring.key
      ANSTS_DIRECTORY_URL: http://celld-brain-01:8081
      ANSTS_DIRECTORY_SERVICE_TOKEN_FILE: /app/.dev-secrets/directory-service.key
      ANSTS_NODE_ROLE: gateway
      ANSTS_CELLD_INTERNAL_URLS: >-
        {"celld-node-01":"http://celld-brain-01:8082","celld-node-02":"http://celld-brain-02:8082","celld-node-03":"http://celld-brain-03:8082"}
      AWS_REGION: us-east-1
      ANSTS_GATEWAY_TOKEN_FILE: /app/.dev-secrets/gateway-control.token
      ANSTS_PEER_BRAIN_URLS: >-
        {"celld-node-01":"http://celld-brain-01:8081","celld-node-02":"http://celld-brain-02:8081","celld-node-03":"http://celld-brain-03:8081"}
      S3_ENDPOINT: http://rustfs:9000
      ANSTS_SCHEDULER_URL: http://celld-brain-01:8081
      ANSTS_RUNTIME_PROFILE: development
      ANSTS_NODE_ID: celld-gw-02
      ANSTS_PEER_BODY_URLS: '{"body-host-01":"http://body-daemon-01:9501","body-host-02":"http://body-daemon-02:9502"}'
      CELLD_ESBUILD: /app/node_modules/@esbuild/linux-x64/bin/esbuild
      ANSTS_CELLD_FLEET_URLS: >-
        {"celld-node-01":"http://celld-brain-01:8081","celld-node-02":"http://celld-brain-02:8081","celld-node-03":"http://celld-brain-03:8081"}
      CELLD_DURABILITY: fleet
      ANSTS_SYSTEM_TOPOLOGY_FILE: /app/deploy/dev-cluster/system-topology.json
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      ANSTS_USER_AUTH_SECRET_FILE: /app/.dev-secrets/user-signing.key
      CELLD_BUCKET: s3://ansts-fleet
      ANSTS_LISTEN_PORT: '8080'
      ANSTS_STORAGE_DIR: /tmp/ansts/celld-gw-02
    entrypoint:
      - /usr/bin/bash
      - /app/deploy/dev-cluster/start-celld-gateway.sh
    ports:
      - '18081:8080'
    volumes:
      - ../..:/app:ro
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - '-c'
        - exec 3<>/dev/tcp/127.0.0.1/8080
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net
    depends_on:
      celld-deploy:
        condition: service_completed_successfully
      body-daemon-01:
        condition: service_healthy
      body-daemon-02:
        condition: service_healthy
  ansts-gateway-01:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-gateway-01
    env_file:
      - ../../.dev-secrets/ansts-gateway-01-runtime.env
    environment:
      ANSTS_MONITORING_TOKEN_FILE: /app/.dev-secrets/monitoring.key
      ANSTS_DIRECTORY_URL: http://celld-brain-01:8081
      ANSTS_DIRECTORY_SERVICE_TOKEN_FILE: /app/.dev-secrets/directory-service.key
      ANSTS_CELLD_INTERNAL_URLS: >-
        {"celld-node-01":"http://celld-brain-01:8082","celld-node-02":"http://celld-brain-02:8082","celld-node-03":"http://celld-brain-03:8082"}
      ANSTS_STORAGE_DIR: /tmp/ansts/celld-gw-01
      S3_ENDPOINT: http://rustfs:9000
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      ANSTS_CELLD_FLEET_URLS: >-
        {"celld-node-01":"http://celld-brain-01:8081","celld-node-02":"http://celld-brain-02:8081","celld-node-03":"http://celld-brain-03:8081"}
      CELLD_ESBUILD: /app/node_modules/@esbuild/linux-x64/bin/esbuild
      ANSTS_NODE_ROLE: gateway
      ANSTS_SCHEDULER_URL: http://celld-brain-01:8081
      CELLD_DURABILITY: fleet
      ANSTS_LISTEN_PORT: '8080'
      ANSTS_PEER_BODY_URLS: '{"body-host-01":"http://body-daemon-01:9501","body-host-02":"http://body-daemon-02:9502"}'
      ANSTS_GATEWAY_TOKEN_FILE: /app/.dev-secrets/gateway-control.token
      ANSTS_NODE_ID: celld-gw-01
      ANSTS_SYSTEM_TOPOLOGY_FILE: /app/deploy/dev-cluster/system-topology.json
      ANSTS_RUNTIME_PROFILE: development
      ANSTS_USER_AUTH_SECRET_FILE: /app/.dev-secrets/user-signing.key
      CELLD_BUCKET: s3://ansts-fleet
      ANSTS_PEER_BRAIN_URLS: >-
        {"celld-node-01":"http://celld-brain-01:8081","celld-node-02":"http://celld-brain-02:8081","celld-node-03":"http://celld-brain-03:8081"}
      AWS_REGION: us-east-1
    entrypoint:
      - /usr/bin/bash
      - /app/deploy/dev-cluster/start-celld-gateway.sh
    ports:
      - '18080:8080'
    volumes:
      - ../..:/app:ro
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - '-c'
        - exec 3<>/dev/tcp/127.0.0.1/8080
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net
    depends_on:
      celld-deploy:
        condition: service_completed_successfully
      body-daemon-01:
        condition: service_healthy
      body-daemon-02:
        condition: service_healthy
  tanstack-console:
    image: nginx:1.27-alpine
    container_name: ansts-tanstack-console
    working_dir: /
    ports:
      - '8088:80'
    volumes:
      - ./nginx-tanstack-console.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - http://127.0.0.1:80/
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net
    depends_on:
      dev-server:
        condition: service_healthy
      ansts-gateway-01:
        condition: service_healthy
      ansts-gateway-02:
        condition: service_healthy
  body-daemon-01:
    image: ansts-v25-dev-cluster-body-daemon-01
    container_name: ansts-body-daemon-01
    env_file:
      - ../../.dev-secrets/body-daemon-01-runtime.env
    environment:
      ANSTS_MONITORING_TOKEN_FILE: /run/secrets/monitoring.token
      CELLD_DURABILITY: fleet
      ANSTS_BODY_CELL_URL: http://body-celld:8080
      ANSTS_SECONDARY_GATEWAY_URL: http://ansts-gateway-02:8080
      AWS_REGION: us-east-1
      ANSTS_BODY_TOKEN_FILE: /run/secrets/body.token
      ANSTS_NODE_ROLE: body
      ANSTS_PRIMARY_GATEWAY_URL: http://ansts-gateway-01:8080
      CELLD_BUCKET: s3://ansts-fleet
      ANSTS_NODE_ID: body-host-01
      ANSTS_RUNTIME_PROFILE: development
      ANSTS_LISTEN_PORT: '9501'
      ANSTS_STORAGE_DIR: /var/lib/ansts/body-host-01
      S3_ENDPOINT: http://rustfs:9000
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
    command:
      - node
      - scripts/start_body_daemon.mjs
    working_dir: /app
    privileged: true
    ports:
      - '19501:9501'
    volumes:
      - ../../.dev-secrets/monitoring.key:/run/secrets/monitoring.token:ro
      - ../../scripts/body_cell_agent.mjs:/app/scripts/body_cell_agent.mjs:ro
      - ../../.dev-secrets/body-host-01.token:/run/secrets/body.token:ro
      - body_01_data:/var/lib/ansts/body-host-01
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://127.0.0.1:9501/health
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    depends_on:
      body-celld:
        condition: service_healthy
  body-daemon-02:
    image: ansts-v25-dev-cluster-body-daemon-02
    container_name: ansts-body-daemon-02
    env_file:
      - ../../.dev-secrets/body-daemon-02-runtime.env
    environment:
      ANSTS_MONITORING_TOKEN_FILE: /run/secrets/monitoring.token
      ANSTS_BODY_CELL_URL: http://body-celld:8080
      ANSTS_BODY_TOKEN_FILE: /run/secrets/body.token
      S3_ENDPOINT: http://rustfs:9000
      ANSTS_RUNTIME_PROFILE: development
      AWS_REGION: us-east-1
      ANSTS_NODE_ROLE: body
      ANSTS_PRIMARY_GATEWAY_URL: http://ansts-gateway-02:8080
      CELLD_DURABILITY: fleet
      ANSTS_NODE_ID: body-host-02
      ANSTS_STORAGE_DIR: /var/lib/ansts/body-host-02
      ANSTS_LISTEN_PORT: '9502'
      ANSTS_SECONDARY_GATEWAY_URL: http://ansts-gateway-01:8080
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      CELLD_BUCKET: s3://ansts-fleet
    command:
      - node
      - scripts/start_body_daemon.mjs
    working_dir: /app
    privileged: true
    ports:
      - '19502:9502'
    volumes:
      - ../../.dev-secrets/monitoring.key:/run/secrets/monitoring.token:ro
      - ../../scripts/body_cell_agent.mjs:/app/scripts/body_cell_agent.mjs:ro
      - ../../.dev-secrets/body-host-02.token:/run/secrets/body.token:ro
      - body_02_data:/var/lib/ansts/body-host-02
    healthcheck:
      test:
        - CMD
        - curl
        - '-fsS'
        - http://127.0.0.1:9502/health
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ansts_mesh_net
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    depends_on:
      body-celld:
        condition: service_healthy
  celld-deploy:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-deploy
    env_file:
      - ../../.dev-secrets/celld-deploy-runtime.env
    environment:
      ANSTS_DIRECTORY_SERVICE_TOKEN_FILE: /app/.dev-secrets/directory-service.key
      ANSTS_ADMISSION_SERVICE_TOKEN_FILE: /app/.dev-secrets/admission-service.key
      ANSTS_ADMISSION_SIGNING_KEY_FILE: /app/.dev-secrets/admission-signing.key
      CELLD_DURABILITY: fleet
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      S3_ENDPOINT: http://rustfs:9000
      ANSTS_BODY_AUTH_SECRET_FILE: /run/secrets/body-signing.key
      CELLD_CONFIG: /app/deploy/celld/wrangler.celld.json
      ANSTS_RUNTIME_PROFILE: development
      ANSTS_BODY_NAMESPACE_PREFIX: ''
      CELLD_ESBUILD: /app/node_modules/@esbuild/linux-x64/bin/esbuild
      AWS_REGION: us-east-1
      ANSTS_BODY_WORKER_URL: http://body-celld:8080
      CELLD_BUCKET: s3://ansts-fleet
    entrypoint:
      - /usr/bin/bash
      - /app/scripts/celld_deploy.sh
    working_dir: /app
    volumes:
      - ../..:/app:ro
      - ../../.dev-secrets/body-signing.key:/run/secrets/body-signing.key:ro
    networks:
      - ansts_mesh_net
    depends_on:
      celld-brain-01:
        condition: service_healthy
      celld-brain-02:
        condition: service_healthy
      celld-brain-03:
        condition: service_healthy
  body-celld:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-body-celld
    environment:
      ANSTS_BODY_AUTH_SECRET_FILE: /app/.dev-secrets/body-signing.key
      ANSTS_SCHEDULER_URL: http://celld-brain-01:8081
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      CELLD_ESBUILD: /app/node_modules/@esbuild/linux-x64/bin/esbuild
    entrypoint:
      - /usr/bin/bash
      - /app/deploy/dev-cluster/start-celld-body.sh
    working_dir: /app
    ports:
      - '18085:8080'
    volumes:
      - ../..:/app:ro
      - body_control_data:/var/lib/ansts-body
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - '-c'
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200
          '
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    networks:
      - ansts_mesh_net
    depends_on:
      celld-deploy:
        condition: service_completed_successfully
  celld-brain-03:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-brain-03
    env_file:
      - ../../.dev-secrets/celld-brain-03-runtime.env
    environment:
      CELLD_ESBUILD: /app/node_modules/@esbuild/linux-x64/bin/esbuild
      CELLD_BUCKET: s3://ansts-fleet
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      CELLD_NODE: celld-node-03
      S3_ENDPOINT: http://rustfs:9000
      RUST_LOG: info
      CELLD_REBALANCE_INTERVAL_MS: '5000'
      CELLD_DURABILITY: fleet
      ANSTS_RUNTIME_PROFILE: development
      CELLD_WATCH: /var/lib/celld
      CELLD_READY_FLEET_GATE_MS: '15000'
      AWS_REGION: us-east-1
      CELLD_TTL_MS: '10000'
    command:
      - '--bucket'
      - s3://ansts-fleet
      - '--endpoint'
      - http://rustfs:9000
      - '--region'
      - us-east-1
      - '--listen'
      - 0.0.0.0:8081
      - '--internal-listen'
      - 0.0.0.0:8082
      - '--advertise'
      - celld-brain-03:8082
    ports:
      - '18084:8081'
    volumes:
      - celld_03_data:/var/lib/celld
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - '-c'
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /.well-known/celld/health HTTP/1.0\r\n\r\n' >&3 && head -n 1
          <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 24
    networks:
      - ansts_mesh_net
    depends_on:
      rustfs:
        condition: service_healthy
  celld-brain-01:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-brain-01
    env_file:
      - ../../.dev-secrets/celld-brain-01-runtime.env
    environment:
      ANSTS_RUNTIME_PROFILE: development
      CELLD_READY_FLEET_GATE_MS: '15000'
      CELLD_ESBUILD: /app/node_modules/@esbuild/linux-x64/bin/esbuild
      S3_ENDPOINT: http://rustfs:9000
      CELLD_TTL_MS: '10000'
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      AWS_REGION: us-east-1
      CELLD_REBALANCE_INTERVAL_MS: '5000'
      CELLD_NODE: celld-node-01
      CELLD_DURABILITY: fleet
      CELLD_WATCH: /var/lib/celld
      RUST_LOG: info
      CELLD_BUCKET: s3://ansts-fleet
    command:
      - '--bucket'
      - s3://ansts-fleet
      - '--endpoint'
      - http://rustfs:9000
      - '--region'
      - us-east-1
      - '--listen'
      - 0.0.0.0:8081
      - '--internal-listen'
      - 0.0.0.0:8082
      - '--advertise'
      - celld-brain-01:8082
    ports:
      - '18082:8081'
    volumes:
      - celld_01_data:/var/lib/celld
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - '-c'
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /.well-known/celld/health HTTP/1.0\r\n\r\n' >&3 && head -n 1
          <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 24
    networks:
      - ansts_mesh_net
    depends_on:
      rustfs:
        condition: service_healthy
  celld-brain-02:
    image: ghcr.io/denoland/celld:0.6.3
    container_name: ansts-celld-brain-02
    env_file:
      - ../../.dev-secrets/celld-brain-02-runtime.env
    environment:
      ANSTS_SCHEDULER_URLS: http://celld-brain-01:8081,http://celld-brain-02:8081,http://celld-brain-03:8081
      CELLD_BUCKET: s3://ansts-fleet
      RUST_LOG: info
      CELLD_REBALANCE_INTERVAL_MS: '5000'
      CELLD_ESBUILD: /app/node_modules/@esbuild/linux-x64/bin/esbuild
      CELLD_READY_FLEET_GATE_MS: '15000'
      AWS_REGION: us-east-1
      CELLD_DURABILITY: fleet
      CELLD_NODE: celld-node-02
      CELLD_TTL_MS: '10000'
      CELLD_WATCH: /var/lib/celld
      S3_ENDPOINT: http://rustfs:9000
      ANSTS_RUNTIME_PROFILE: development
    command:
      - '--bucket'
      - s3://ansts-fleet
      - '--endpoint'
      - http://rustfs:9000
      - '--region'
      - us-east-1
      - '--listen'
      - 0.0.0.0:8081
      - '--internal-listen'
      - 0.0.0.0:8082
      - '--advertise'
      - celld-brain-02:8082
    ports:
      - '18083:8081'
    volumes:
      - celld_02_data:/var/lib/celld
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - '-c'
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /.well-known/celld/health HTTP/1.0\r\n\r\n' >&3 && head -n 1
          <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      start_period: 45s
      retries: 24
    networks:
      - ansts_mesh_net
    depends_on:
      rustfs:
        condition: service_healthy
  rustfs:
    image: rustfs/rustfs:latest
    container_name: ansts-dev-rustfs
    env_file:
      - ../../.dev-secrets/rustfs-runtime.env
    environment:
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    working_dir: /
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfs_dev_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health/live 2>/dev/null || curl -fsS http://127.0.0.1:9000/ 2>/dev/null
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    networks:
      - ansts_mesh_net
  body-state-migrate:
    image: node:22-alpine
    container_name: ansts-body-state-migrate
    environment:
      ANSTS_LEGACY_BODY_URL: http://celld-brain-01:8081
      ANSTS_BODY_CELL_URL: http://body-celld:8080
      ANSTS_BODY_AUTH_SECRET_FILE: /app/.dev-secrets/body-signing.key
    command:
      - node
      - /app/scripts/migrate_body_control_state.mjs
    working_dir: /app
    volumes:
      - ../..:/app:ro
    networks:
      - ansts_mesh_net
    profiles:
      - legacy-migration
    restart: 'no'
  grafana:
    image: grafana/grafana:11.0.0
    container_name: ansts-dev-grafana
    env_file:
      - ../../.dev-secrets/grafana-runtime.env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    working_dir: /usr/share/grafana
    ports:
      - '3000:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana-dashboard.json:/var/lib/grafana/dashboards/ansts.json:ro
    networks:
      - ansts_mesh_net
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: ansts-dev-prometheus
    working_dir: /prometheus
    ports:
      - '9090:9090'
    volumes:
      - ../../.dev-secrets/monitoring/prometheus.token:/run/secrets/monitoring.token:ro
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./usage-alerts.yml:/etc/prometheus/usage-alerts.yml:ro
    networks:
      - ansts_mesh_net
networks:
  ansts_mesh_net:
    name: ansts-v25-dev-cluster_ansts_mesh_net
    driver: bridge
volumes:
  body_01_data:
    name: ansts-v25-dev-cluster_body_01_data
  body_02_data:
    name: ansts-v25-dev-cluster_body_02_data
  body_control_data:
    name: ansts-v25-dev-cluster_body_control_data
  celld_03_data:
    name: ansts-v25-dev-cluster_celld_03_data
  celld_01_data:
    name: ansts-v25-dev-cluster_celld_01_data
  celld_02_data:
    name: ansts-v25-dev-cluster_celld_02_data
  rustfs_dev_data:
    name: ansts-v25-dev-cluster_rustfs_dev_data
  grafana_data:
    name: ansts-v25-dev-cluster_grafana_data
  prometheus_data:
    name: ansts-v25-dev-cluster_prometheus_data
