upstream ansts_gateways {
    server ansts-gateway-01:8080;
    server ansts-gateway-02:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # [M77] Production payload size guard & Gzip compression
    client_max_body_size 10m;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # [M77] Production HTTP Security & CSP Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;" always;

    # [M76-P1-5] Dedicated unbuffered SSE stream proxy for both /v1/events/stream and /v1beta1/management/events/stream
    location ~ ^/(v1/events/stream|v1beta1/management/events/stream)$ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /v1/ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /internal/v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # [M76-P1-4] SPA fallback to /index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
