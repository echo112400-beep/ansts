upstream ansts_gateways {
    server ansts-gateway-01:8080;
    server ansts-gateway-02:8080;
}

server {
    listen 80;
    server_name _;

    location = /v1/events/stream {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location = /v1beta1/management/events/stream {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_set_header Host $host;
    }

    location /internal/v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
