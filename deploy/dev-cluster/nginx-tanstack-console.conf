upstream ansts_gateways {
    server ansts-gateway-01:8080;
    server ansts-gateway-02:8080;
}

server {
    listen 80;
    server_name _;

    location /v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_set_header Host $host;
    }

    location /internal/v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =200;
    }
}
