log_format ansts_oauth '$remote_addr [$time_local] "$request_method $uri" $status';

upstream ansts_gateways {
    zone ansts_gateways 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    ${ANSTS_NGINX_GATEWAY_SERVERS}
    keepalive 32;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server_name _;

    # [M77] Production payload size guard & Gzip compression
    client_max_body_size 10m;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # [M77 & M93] Production HTTP Security, CSP & Local Dev CORS Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss:; img-src 'self' data: https://avatars.githubusercontent.com;" always;

    # [M76-P1-5] Dedicated unbuffered SSE stream proxy for both /v1/events/stream and /v1beta1/management/events/stream
    location ~ ^/(v1/events/stream|v1beta1/management/events/stream)$ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # [M93] Proxy native celld health, state, and Prometheus metrics endpoints
    location ~ ^/(\.well-known/celld/health|healthz|health|readyz|state|metrics)$ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location = /auth/callback/github {
        access_log /var/log/nginx/access.log ansts_oauth;
        proxy_pass http://ansts_gateways;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /internal/v1beta1/ {
        proxy_pass http://ansts_gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        set $next_console http://dev-server:3000;
        proxy_pass $next_console;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
