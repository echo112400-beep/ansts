server {
    listen 80;
    server_name localhost console.ansts.local;

    root /usr/share/nginx/html;
    index ansts_console_prototype.html index.html;

    # SPA fallback to TanStack Management Console UI
    location / {
        try_files $uri $uri/ /ansts_console_prototype.html;
    }

    # Proxy BFF & Task Dispatch APIs to Active-Active Gateway Cluster
    location /v1beta1/ {
        proxy_pass http://ansts-gateway-01:8080/v1beta1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /internal/ {
        proxy_pass http://ansts-gateway-01:8080/internal/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://ansts-gateway-01:8080/metrics;
    }
}
