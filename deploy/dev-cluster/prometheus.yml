global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/usage-alerts.yml
scrape_configs:
  - job_name: ansts-gateways
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitoring.token
    static_configs:
      - targets: ["ansts-gateway-01:8080", "ansts-gateway-02:8080"]
  - job_name: ansts-body-daemons
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitoring.token
    static_configs:
      - targets: ["body-daemon-01:9501", "body-daemon-02:9502"]
# Metrics use an independent read-only credential; no task or tenant labels.
