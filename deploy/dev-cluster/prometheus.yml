global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "ansts-gateways"
    static_configs:
      - targets: ["ansts-gateway-01:8080", "ansts-gateway-02:8080"]
  - job_name: "ansts-body-daemons"
    static_configs:
      - targets: ["body-daemon-01:9501", "body-daemon-02:9502"]
# celld nodes expose only JSON (`<internal>/state`, `fleet/capacity-v1.json`), not a Prometheus
# endpoint, so there is no scrape job for the brain layer; the gateway consults it via CelldFleetClient.
